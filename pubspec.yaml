name: gain_plus
description: "Gain+ - Your fitness tracking companion"
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.1
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  intl: ^0.19.0
  table_calendar: ^3.1.2
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.0
  share_plus: ^10.1.0
  flutter_timezone: ^5.1.1
  firebase_core: ^4.15.0
  uuid: ^4.6.0
  shared_preferences: ^2.5.6
  fl_chart: ^1.2.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0
  connectivity_plus: ^7.3.1
  http: ^1.6.0
  health: ^13.3.1
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  home_widget: ^0.10.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Barlow (SIL Open Font License, see assets/fonts/OFL.txt), bundled so
  # the app looks right offline.
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800

# App icon: `dart run flutter_launcher_icons` regenerates every size.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0B0B0C"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#0B0B0C"
    theme_color: "#C8F031"
