<!-- Source of the app icon. Open in Chrome and screenshot at 1024x1024; #fg = adaptive foreground, #mono = notification icon. -->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:BC;src:url('../fonts/BarlowCondensed-ExtraBold.ttf');font-weight:800}
html,body{margin:0;padding:0;background:transparent;width:100vw;height:100vh;overflow:hidden}
svg{display:block;width:100vw;height:100vh}
</style></head><body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <rect id="bg" width="1024" height="1024" fill="#0B0B0C"/>
  <g id="mark" transform="translate(512 512) skewX(-9)">
    <g transform="translate(-95 8)">
      <text x="-36" y="230" text-anchor="middle" font-family="BC" font-weight="800" font-size="660" fill="#C8F031" transform="scale(1.12 1)">G</text>
      <g transform="translate(246 -172)">
        <rect x="-34" y="-110" width="68" height="220" rx="12" fill="#C8F031"/>
        <rect x="-110" y="-34" width="220" height="68" rx="12" fill="#C8F031"/>
      </g>
    </g>
  </g>
</svg>
<script>
const mode = location.hash.slice(1);
const mark = document.getElementById('mark');
// Adaptive-icon foreground: transparent, mark inside the 66% safe zone.
if (mode === 'fg') { document.getElementById('bg').remove(); mark.setAttribute('transform', 'translate(512 512) scale(0.72) skewX(-9)'); }
// Notification icon: white silhouette on transparent.
if (mode === 'mono') {
  document.getElementById('bg').remove();
  mark.setAttribute('transform', 'translate(512 512) scale(0.8) skewX(-9)');
  document.querySelectorAll('#mark text, #mark rect').forEach(e => e.setAttribute('fill', '#FFFFFF'));
}
</script></body></html>
